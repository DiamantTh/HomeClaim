[homeclaim]
locale = "en"

[homeclaim.storage]
type = "JDBC"
driver = "SQLITE"
sqliteFile = "plugins/HomeClaim/homeclaim.db"
encoding = "UTF-8"
maximumPoolSize = 10

[homeclaim.rest]
enabled = false
port = 8080
token = ""
tokenEnv = ""
tokenFile = ""
rateLimitPerMinute = 0
allowLocalhost = false
allowedHosts = []

[homeclaim.limits]
# -1 means unlimited. These operation quotas are enforced by the shared plot operation service.
maxPlotsPerPlayer = -1
maxMergedRegions = -1

[homeclaim.migrations]
enabled = true
allowNonPostgres = true
baselineOnMigrate = true
locations = ["classpath:db/migration/common"]

[homeclaim.clientlink]
enabled = false
logTraffic = false
channels = ["homeclaim:admin", "homeclaim:support"]

