# Legacy YAML sample. The Paper runtime reads HomeClaim.toml instead.
# Kept for older tooling; edits here do not change active plugin configuration.
homeclaim:
  locale: "en"
  storage:
    type: JDBC
    driver: SQLITE
    sqliteFile: "plugins/HomeClaim/homeclaim.db"
    # PostgreSQL is the recommended server/reference database; MariaDB is supported.
    # SQLite is the zero-configuration option. MySQL is experimental and unverified.
    # To use PostgreSQL, uncomment and configure:
    # driver: POSTGRES
    # host: "localhost"
    # port: 5432
    # database: "homeclaim"
    # username: "homeclaim"
    # password: "change-me"
    encoding: "UTF-8"
    maximumPoolSize: 10
  rest:
    enabled: false
    port: 8080
    bindHost: "127.0.0.1"
    allowRemote: false
    token: ""
    tokenEnv: ""
    tokenFile: ""
    rateLimitPerMinute: 0
    allowLocalhost: false
    allowedHosts: []
    allowedHostHeaders: []
    cors:
      enabled: false
      allowedOrigins: []
  webux:
    enabled: false
    host: "127.0.0.1"
    port: 8081
    allowRemote: false
    secureCookies: false
    allowedHosts: []
    allowedOrigins: []
  plotWorlds: {}
